<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/game.css">
    <link rel="stylesheet" href="../css/popup.css">
    <title>Query</title>
</head>
<body>

    <div id="game-container">
        <h1>Query_</h1>
        
        <div id="question-text">Chargement de l'épreuve...</div>
        
        <div id="answers-container">
            <!-- Les boutons seront générés ici par ton script JS -->
        </div>

        <div id="death-message"></div>
        
        <button id="restart-btn">Tenter une nouvelle fois</button>
    </div>


    <button id="settings-btn" onclick="document.getElementById('settings-modal').style.display='flex'">
        <img src="../img/reglages.png" alt="Réglages">
    </button>
     <div id="settings-modal" style="display:none">
        <div id="settings-content">
            <h2>Réglages</h2>
            <!-- Ton contenu ici -->
            <div id="settings-actions">
                <button class="settings-action-btn" onclick="saveGame()">Sauvegarder</button>
                <button class="settings-action-btn danger" onclick="quitGame()">Quitter</button>
                <button class="settings-action-btn" onclick="document.getElementById('settings-modal').style.display='none'">Fermer</button>
            </div>
        </div>
    </div>

<!--Essaye page Game over-->
    <div id="buttons">
        <button class="menu-btn" onclick="gameOver()">
            <img src="../img/jouer.png" alt="Jouer">
        </button>
    </div>
    
    <div id="transition-overlay"></div>
    <script src="../js/questionsSimples.js"></script>
    <script src="../js/questionsIntermediaires.js"></script>
    <script src="../js/questionsAvancee.js"></script>
    <script src="../js/deathsMessages.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/utilitys.js"></script>
    <script src="../js/qcm.js"></script>
</body>
</html>
